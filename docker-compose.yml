services:
  misub:
    build: .
    image: misub-lite:latest
    container_name: misub-lite
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      ADMIN_PASSWORD: "admin"
      COOKIE_SECRET: ""
      MISUB_PUBLIC_URL: ""
      CORS_ORIGINS: ""
      MISUB_DATA_DIR: /app/data
      MISUB_DB_PATH: /app/data/misub.sqlite
      MISUB_STATIC_DIR: /app/dist
    volumes:
      - misub-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/public_config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  misub-data:
