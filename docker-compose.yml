services:
  misub:
    build: .
    image: misub-lite:latest
    container_name: misub-lite
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      # 可选：直接设密码（也可用挂载的 config.yaml / 首次引导页）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      MISUB_PUBLIC_URL: ${MISUB_PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MISUB_DATA_DIR: /app/data
      MISUB_DB_PATH: /app/data/misub.sqlite
      MISUB_STATIC_DIR: /app/dist
    volumes:
      # 持久化 SQLite 与运行数据
      - misub-data:/app/data
      # 可选：挂载本地配置（取消下一行注释）
      # - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/public_config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  misub-data:
