siteName: "MiSub-lite"
repoUrl: "https://github.com/xmsssssss/MiSub-lite"
subscriptionToken: "auto"
profileToken: "profiles"
customLoginPath: "login"
enablePublicPage: false
enableAccessLog: false
storageType: "sqlite"
