# MiSub-lite 配置
# 复制为 config.yaml 后修改：
#   copy config.example.yaml config.yaml
#
# 优先级：环境变量 > config.yaml > 默认值

host: "0.0.0.0"
port: 8787

adminPassword: "change-me"
cookieSecret: ""

publicUrl: ""
callbackUrl: ""
corsOrigins: ""

dbPath: ""
